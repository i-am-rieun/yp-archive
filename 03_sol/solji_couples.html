/* 일반 페이지 콘텐츠 복사 제한: 텍스트 선택은 허용하고 복사 이벤트만 차단합니다. 입력 영역은 예외입니다. */
(() => {
  "use strict";
  document.addEventListener("copy", (event) => {
    const target = event.target;
    if (target && target.closest && target.closest('input, textarea, select, [contenteditable="true"], [role="textbox"]')) {
      return;
    }
    const selection = window.getSelection();
    if (selection && !selection.isCollapsed) {
      event.preventDefault();
    }
  }, true);
})();
